# Standalone Git bootstrap: no local credit-card-fraud checkout is required.
# expops run --project local --compute compute.git.slurm.yaml
# Pin the project source independently of subsequent deployment/docs changes.
provider: slurm

# Start conservatively for the first cluster run. The active pipeline expands
# to nine scoring branches, which Dask will process in waves across two workers.
num_workers: 2

options:
  queue: "normal"
  worker_cores: 1
  worker_memory: "4GB"
  worker_processes: 1
  walltime: "00:30:00"

  # Values reported by sacctmgr on xlogin2.
  job_extra:
    - "--account=allusers"
    - "--qos=normal"

  # Keep both workers eligible for the same node during the smoke run. We can
  # enable node spreading later when measuring multi-node scaling.
  spread_workers_across_nodes: false

# Deployment resources live in one file, but ExpOps parses compute and storage
# into independent plans with independent ownership and lifecycles.
storage:
  metadata:
    type: sql
    dialect: postgresql
    password_ref:
      source: environment
      name: CREDIT_CARD_FRAUD_SQL_PASSWORD
      required: true
    connection:
      host: aws-0-ap-southeast-1.pooler.supabase.com
      port: 6543 # Use this for NUS VPN
      database: postgres
      username: postgres.dzzzeqtjpdfknbggnotp
      options:
        sslmode: require

    # type: redis
    # password_ref:
    #   source: environment
    #   name: CREDIT_CARD_FRAUD_REDIS_PASSWORD
    #   required: true
    # host: afterthought-cakes-button-30026.db.redis.io
    # port: 17421
    # db: 0
    # connection_timeout: 5.0

  # Keep the project's local/... paths while obtaining their files from Git.
  mounts:
    local:
      type: git
      repository: https://github.com/Professional-Procrastinat0r/credit-card-fraud.git
      revision: 242875f4b9f0f516174ac611cef1fd56582a87e3
    input:
      type: gcs
      bucket: expops-example-credit-card-fraud
      prefix: credit-card-fraud/dataset
      gcp_project: exp-ops-506607
      # S3 input alternative: replace this mount with the following provider.
      # type: s3
      # bucket: expops-test-bucket-755933694771-ap-southeast-1-an
      # prefix: credit-card-fraud
      # region: ap-southeast-1
      # profile: expops
    cache:
      type: gcs
      bucket: expops-example-credit-card-fraud
      prefix: credit-card-fraud/vfs/cache
      gcp_project: exp-ops-506607
      policy:
        ttl_hours: 24
    artefact:
      type: gcs
      bucket: expops-example-credit-card-fraud
      prefix: credit-card-fraud/vfs/artefact
      gcp_project: exp-ops-506607
      # S3 artefact alternative: replace this mount with the following provider.
      # type: s3
      # bucket: expops-test-bucket-755933694771-ap-southeast-1-an
      # prefix: credit-card-fraud/vfs/artefact
      # region: ap-southeast-1
      # profile: expops
