# Local workers with S3 input and GCS cache/artefacts.
provider: local
num_workers: 2
options:
  startup_timeout_sec: 90
  worker_memory: 0
storage:
  metadata:
    type: sql
    dialect: postgresql
    password_ref:
      source: environment
      name: CREDIT_CARD_FRAUD_SQL_PASSWORD
      required: true
    connection:
      host: aws-0-ap-southeast-1.pooler.supabase.com
      port: 6543 # Use this for NUS VPN
      database: postgres
      username: postgres.dzzzeqtjpdfknbggnotp
      options:
        sslmode: require

    # type: redis
    # password_ref:
    #   source: environment
    #   name: CREDIT_CARD_FRAUD_REDIS_PASSWORD
    #   required: true
    # host: afterthought-cakes-button-30026.db.redis.io
    # port: 17421
    # db: 0
    # connection_timeout: 5.0

  # Mount sources resolve relative to this deployment file.
  mounts:
    local:
      type: local
      source: ..
      access: staged
    input:
      # type: gcs
      # bucket: expops-example-credit-card-fraud
      # prefix: credit-card-fraud/dataset
      # gcp_project: exp-ops-506607
      # GCS input alternative is shown above; activate one complete provider block.
      type: s3
      bucket: expops-test-bucket-755933694771-ap-southeast-1-an
      prefix: credit-card-fraud/dataset
      region: ap-southeast-1
      profile: expops
    cache:
      type: gcs
      bucket: expops-example-credit-card-fraud
      prefix: credit-card-fraud/vfs/cache
      gcp_project: exp-ops-506607
      policy:
        ttl_hours: 24
    artefact:
      # type: s3
      # bucket: expops-test-bucket-755933694771-ap-southeast-1-an
      # prefix: credit-card-fraud/vfs/artefact
      # region: ap-southeast-1
      # profile: expops
      # S3 artefact alternative is shown above; activate one complete provider block.
      type: gcs
      bucket: expops-example-credit-card-fraud
      prefix: credit-card-fraud/vfs/artefact
      gcp_project: exp-ops-506607
