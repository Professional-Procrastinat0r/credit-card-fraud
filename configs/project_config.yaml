metadata:
  name: "credit-card-fraud"
  description: "Credit-card fraud detection nested seed and data parallelism"
  version: "0.4.0"

scripts:
  main: "src/model.py"
  reporting: "src/plot_metrics.py"

environment:
  fraud-model-env:
    venv: ["requirements.txt"]

  fraud-reporting-env:
    venv: ["requirements-charts.txt"]

reproducibility:
  random_seed: 42

data:
  path: "data/creditcard.csv"

experiment:
  cache:
    backend:
      type: sql
      dialect: postgresql
      # Supply the password at runtime through MLOPS_SQL_PASSWORD.
      connection:
        host: aws-0-ap-southeast-1.pooler.supabase.com
        # port: 5432
        port: 6543 # Use this for NUS VPN
        database: postgres
        username: postgres.dzzzeqtjpdfknbggnotp
        options:
          sslmode: require

      # type: redis
      # # Supply the password at runtime through MLOPS_REDIS_PASSWORD. The Redis
      # # Cloud connection uses its default user, so no username is required here.
      # host: afterthought-cakes-button-30026.db.redis.io
      # port: 17421
      # db: 0
      # connection_timeout: 5.0

    # Keep the billing/quota project explicit because user ADC files do not
    # necessarily contain a default Google Cloud project.
    object_store:
      # type: gcs
      # bucket: "expops-example-credit-card-fraud"
      # gcp_project: "exp-ops-506607"

      type: s3
      bucket: expops-test-bucket-755933694771-ap-southeast-1-an
      region: ap-southeast-1
      profile: expops

  pipeline:
    process_adjlist: |
      validate_data seed_parallel
      seed_parallel train_model
      train_model prepare_evaluation_data
      prepare_evaluation_data data_parallel
      data_parallel evaluate_partition
      evaluate_partition aggregate_partition_metrics
      aggregate_partition_metrics aggregate_seed_data_metrics
      aggregate_seed_data_metrics plot_seed_data_parallel_metrics

    processes:
      - name: "validate_data"
        environment: "fraud-model-env"

      - name: "seed_parallel"
        description: "Fan out training and held-out evaluation by split seed"
        seed_parallelism:
          seeds: [41, 42, 43]

      - name: "train_model"
        environment: "fraud-model-env"
        parameters:
          test_size: 0.2
          max_iter: 1000
          class_weight: "balanced"

      - name: "prepare_evaluation_data"
        environment: "fraud-model-env"

      - name: "data_parallel"
        description: "Split held-out rows into three scoring partitions"
        data_parallelism:
          size: 3
          data_name: "evaluation_rows"

      - name: "evaluate_partition"
        environment: "fraud-model-env"
        parameters:
          threshold: 0.5

      - name: "aggregate_partition_metrics"
        code: "main.aggregate_partition_metrics"
        environment: "fraud-model-env"
        data_aggregation: true

      - name: "aggregate_seed_data_metrics"
        code: "main.aggregate_seed_data_metrics"
        environment: "fraud-model-env"
        seed_aggregation: true

      - name: "plot_seed_data_parallel_metrics"
        type: "chart"
        chart_type: "static"
        code: "reporting.plot_seed_data_parallel_metrics"
        environment: "fraud-reporting-env"
        probe_paths:
          combined_summary: "//process[@name='aggregate_seed_data_metrics']"
