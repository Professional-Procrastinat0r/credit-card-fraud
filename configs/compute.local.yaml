# Mount sources resolve relative to this file, not the caller's CWD.
# expops run configs/compute.local.yaml --local
# Environments are prepared on this host; no remote bootstrap/wheel is needed.
provider: local
num_workers: 2
options:
  materialization:
    cleanup: always  # always | on_success | never; owned driver input and worker source/input copies.
  startup_timeout_sec: 90
  local_cluster_kwargs:
    memory_limit: 0
storage:
  metadata:
    type: sql
    dialect: sqlite
    connection:
      # SQLite paths resolve relative to the native project root.
      database: .credit-card-fraud/storage/metadata.db
  mounts:
    code:
      type: local
      source: ..
      read_only: true
    input:
      type: local
      source: ../data
    cache:
      type: local
      source: ../.credit-card-fraud/storage/cache
      policy:
        ttl_hours: 24
    artefact:
      type: local
      source: ../.credit-card-fraud/storage/artefact
