metadata:
  name: credit-card-fraud-vfs-baseline
  description: Single-seed mounted control; not the nested parallel experiment
  version: 1.0.0
scripts:
  main: src/main.py
environment:
  baseline:
    venv: [requirements.txt]
reproducibility:
  random_seed: 42
data:
  inputs:
    training:
      path: vfs://input/creditcard.csv
experiment:
  pipeline:
    process_adjlist: |
      train_model evaluate_model
      evaluate_model report
    processes:
      - name: train_model
        code: main.train_model
        parameters:
          test_size: 0.2
          random_seed: 42
          max_iter: 1000
          class_weight: balanced
      - name: evaluate_model
        code: main.evaluate_model
        parameters:
          threshold: 0.5
      - name: report
        type: chart
        code: main.report
        probe_paths:
          evaluation: "//process[@name='evaluate_model']"
