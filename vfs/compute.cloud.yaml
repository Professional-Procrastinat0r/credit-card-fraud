# Optional deployment example: local workers, existing remote input, separate
# new managed output prefixes. Review write permissions before executing it.
provider: local
num_workers: 2
options:
  startup_timeout_sec: 90
  worker_memory: 0
storage:
  metadata:
    type: sql
    dialect: postgresql
    password_ref:
      source: environment
      name: CREDIT_CARD_FRAUD_SQL_PASSWORD
      required: true
    connection:
      host: aws-0-ap-southeast-1.pooler.supabase.com
      port: 6543
      database: postgres
      username: postgres.dzzzeqtjpdfknbggnotp
      options:
        sslmode: require
    # Redis alternative: replace the whole metadata block, not its type alone.
